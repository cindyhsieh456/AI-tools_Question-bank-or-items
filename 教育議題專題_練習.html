function makeRound(){let repeat=$("repeatWrong").checked;let pool=repeat&&wrongs.size?[...wrongs].map(id=>BANK.find(q=>q.id===id)).filter(Boolean):BANK;order=shuffle(pool.map(q=>q.id));pos=0;render();updateStats()}
function render(){if(!order.length){$("question").textContent="目前沒有可練習的錯題";$("options").innerHTML="";return}
const q=BANK.find(x=>x.id===order[pos]);selected=null;answered=false;currentOptions=shuffle(q.options.map((text,index)=>({text,originalIndex:index})));
$("counter").textContent=`第 ${pos+1} / ${order.length} 題`;$("progressText").textContent=`${sessionAnswered} 題已作答`;
$("progressBar").style.width=`${sessionAnswered/Math.max(BANK.length,sessionAnswered||1)*100}%`;
$("year").textContent=q.year;$("subject").textContent=q.subject;$("question").textContent=q.question;
$("options").innerHTML="";currentOptions.forEach((o,i)=>{const b=document.createElement("button");b.className="option";b.innerHTML=`<span class="letter">${LETTERS[i]}</span><span></span>`;b.querySelector("span:last-child").textContent=o.text;b.onclick=()=>choose(i);$("options").appendChild(b)});
$("feedback").className="feedback";$("feedback").textContent="";
$("bookmark").classList.toggle("bookmarked",bookmarks.has(q.id));$("bookmark").textContent=bookmarks.has(q.id)?"★ 已加入錯題書籤":"☆ 標記錯題";
$("next").textContent=pos===order.length-1?"完成本輪 ✓":"下一題 →";
}
function choose(i){if(answered)return;answered=true;selected=i;const q=BANK.find(x=>x.id===order[pos]);const right=currentOptions[i].text===q.answerText;
[...$("options").children].forEach((el,j)=>{el.disabled=true;if(currentOptions[j].text===q.answerText)el.classList.add("correct");if(j===i&&!right)el.classList.add("wrong")});
const f=$("feedback");f.className="feedback show "+(right?"good":"bad");f.textContent=right?`答對了！正確答案：${q.answerText}`:`答錯了。正確答案：${q.answerText}`;
sessionAnswered++;stats.answered++;if(right){sessionCorrect++;stats.correct++;wrongs.delete(q.id)}else{wrongs.add(q.id);bookmarks.add(q.id)}
save();updateStats();$("bookmark").classList.toggle("bookmarked",bookmarks.has(q.id));$("bookmark").textContent=bookmarks.has(q.id)?"★ 已加入錯題書籤":"☆ 標記錯題";
$("progressText").textContent=`${sessionAnswered} 題已作答`;$("progressBar").style.width=`${Math.min(100,sessionAnswered/Math.max(BANK.length,sessionAnswered)*100)}%`;
}
function updateStats(){$("total").textContent=BANK.length;$("correctCount").textContent=sessionCorrect;$("wrongCount").textContent=bookmarks.size;}
$("bookmark").onclick=()=>{const id=order[pos];if(bookmarks.has(id))bookmarks.delete(id);else bookmarks.add(id);save();$("bookmark").classList.toggle("bookmarked",bookmarks.has(id));$("bookmark").textContent=bookmarks.has(id)?"★ 已加入錯題書籤":"☆ 標記錯題";updateStats()};
$("next").onclick=()=>{if(!answered){if(!confirm("這題還沒作答，要直接跳過嗎？"))return}if(pos<order.length-1){pos++;render()}else{alert(`本輪完成！答對 ${sessionCorrect} 題，共作答 ${sessionAnswered} 題。`);makeRound()}};
$("restart").onclick=()=>{sessionCorrect=0;sessionAnswered=0;makeRound()};
$("repeatWrong").onchange=()=>{sessionCorrect=0;sessionAnswered=0;makeRound()};
makeRound();
</script></body></html>
