<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Baltimore Virus Classification Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7fb;--fg:#1c2233;--card:#fff;--line:#d9dde8;--acc:#4f46e5;--mut:#5b6478;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141c;--fg:#e8eaf2;--card:#1c2030;--line:#343a50;--acc:#8b87ff;--mut:#9aa3ba}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:6px;overflow-x:auto;z-index:5}
nav button{flex:1;white-space:nowrap;border:0;background:none;color:var(--mut);padding:10px 14px;border-radius:8px;font:600 14px inherit;cursor:pointer}
nav button.on{background:var(--acc);color:#fff}
main{max-width:980px;margin:auto;padding:16px}h2{margin:.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;font-size:14px}th{background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.grid div{text-align:center;font-size:12px;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--bg)}
svg{max-width:100%}.lg{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin:8px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.def{display:flex;gap:12px;align-items:flex-start}.pane{flex:1;min-width:0;perspective:900px}
#dc{--d:1;transition:transform .45s cubic-bezier(.5,0,.3,1),opacity .45s;transform-origin:50% 50% -260px;backface-visibility:hidden}#dc.out{transform:rotateX(calc(var(--d)*80deg));opacity:0}#dc.in{transform:rotateX(calc(var(--d)*-80deg));opacity:0;transition:none}
.tabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:64px}.tabs button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--fg);font:700 13px inherit;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.12)}
.two{display:grid;grid-template-columns:200px 1fr;gap:14px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:6px 0 12px}.flow span.b{padding:5px 9px;border-radius:8px;font-size:13px;color:#fff}.flow em{color:var(--mut);font-style:normal}
.D{background:#2563eb}.R{background:#dc2626}.E{background:#ca8a04}.E.vc,.E.ve{background:#9333ea}.E.ve{outline:2px dashed #fff;outline-offset:-4px}.E.hv{background:linear-gradient(90deg,#ca8a04 50%,#9333ea 50%)}.P{background:#16a34a}.b{text-align:center}.b small{display:block;font-size:10px;opacity:.92}
.dif td{background:rgba(250,204,21,.18)}select,.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}.btn{background:var(--acc);color:#fff;border:0;cursor:pointer;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.opt.ok{background:#16a34a;color:#fff}.opt.no{background:#dc2626;color:#fff}.ex{border-left:4px solid var(--acc);padding:6px 10px;margin:6px 0 14px;background:var(--bg);font-size:14px}
.zh{color:var(--mut)}.sec{display:none}.sec.on{display:block}
</style></head><body>
<nav id="nav"></nav><main>
<section id="s0" class="sec on"></section><section id="s1" class="sec"></section><section id="s2" class="sec"></section><section id="s3" class="sec"></section>
</main>
<script>
const C=[
{n:'I',t:'dsDNA',g:'Double-stranded DNA',env:'Mixed (herpes, pox: yes; adeno, HPV: no)',enz:'None (poxvirus carries DdRp)',site:'Nucleus (核); poxvirus: cytoplasm (細胞質)',mrna:'DNA → mRNA by DNA-dependent RNA polymerase (host or viral)',rep:'DNA-dependent DNA polymerase copies both strands',ex:'Herpesvirus, Adenovirus, HPV, Poxvirus',e:'Herpesvirus',v:{e:1,t:'D',k:'ds'},
d:'The dsDNA genome behaves like a cellular gene: it is transcribed (轉錄) into mRNA by a DNA-dependent RNA polymerase (DdRp). Most use the host enzyme in the nucleus; large poxviruses replicate in the cytoplasm so they package their own DdRp.',cf:'Not the same as VII: Group I never uses reverse transcriptase (反轉錄酶).',
m:['D:dsDNA genome','E:DdRp (host/viral)','R:+mRNA','P:Viral proteins'],r:['D:dsDNA','E:DNA-dep. DNA polymerase','D:new dsDNA']},
{n:'II',t:'ssDNA',g:'Single-stranded DNA',env:'No (naked 無外套膜)',enz:'None',site:'Nucleus',mrna:'ssDNA → dsDNA (host DNA pol) → mRNA (host RNA pol)',rep:'Host DNA polymerase, via a dsDNA intermediate (中間產物)',ex:'Parvovirus B19',e:'Parvovirus',v:{e:0,t:'D',k:'ss'},
d:'Small viruses with a single-stranded DNA genome. They depend entirely on host enzymes: the host DNA polymerase first makes a dsDNA copy, then host RNA polymerase transcribes it. Only one Baltimore group exists for ssDNA because the genome is always converted to dsDNA before transcription.',cf:'Confused with I: both transcribe DNA, but II needs a ss→ds conversion step first.',
m:['D:ssDNA','E:Host DNA pol','D:dsDNA intermediate','E:Host RNA pol','R:+mRNA','P:Proteins'],r:['D:ssDNA','E:Host DNA pol','D:dsDNA','E:Host DNA pol','D:new ssDNA']},
{n:'III',t:'dsRNA',g:'Double-stranded RNA',env:'No',enz:'RNA-dependent RNA polymerase (RdRp)',site:'Cytoplasm, inside the viral core',mrna:'Virion RdRp copies dsRNA → +ssRNA (mRNA)',rep:'RdRp makes +ssRNA, which is then copied into dsRNA',ex:'Rotavirus, Reovirus',e:'Rotavirus',v:{e:0,t:'R',k:'ds',z:'RdRp'},
d:'Animal cells have no enzyme that copies RNA from RNA, so the virus must carry its own RdRp. The genome stays inside the core particle (核心顆粒) to avoid triggering host defences, and mRNA is extruded (擠出) from it.',cf:'Confused with V: both carry RdRp, but III starts from dsRNA, V from −ssRNA.',
m:['R:dsRNA (in core)','E:Virion RdRp','R:+ssRNA = mRNA','P:Proteins'],r:['R:+ssRNA','E:RdRp','R:dsRNA genome']},
{n:'IV',t:'+ssRNA',g:'Positive-sense single-stranded RNA',env:'Mixed (picorna: no; corona, flavi, toga: yes)',enz:'None',site:'Cytoplasm',mrna:'Genome itself is mRNA (translated directly)',rep:'Translated RdRp makes −RNA template, then new +RNA',ex:'Poliovirus, SARS-CoV-2, Dengue, Rubella',e:'Coronavirus',v:{e:1,t:'R',k:'ss',s:'+'},
d:'The genome has the same sense as mRNA, so ribosomes translate it immediately after entry. One of the first products is the RdRp, which then copies the genome.',cf:'Only Group IV: purified genomic RNA alone is infectious (具感染性).',
m:['R:+ssRNA genome = mRNA','E:Host ribosome','P:Polyprotein (多蛋白) incl. RdRp'],r:['R:+ssRNA','E:RdRp','R:−ssRNA template','E:RdRp','R:new +ssRNA']},
{n:'V',t:'−ssRNA',g:'Negative-sense single-stranded RNA',env:'Yes (all enveloped)',enz:'RdRp',site:'Cytoplasm (influenza: nucleus)',mrna:'Virion RdRp copies −RNA → +mRNA',rep:'−RNA → +RNA antigenome → new −RNA',ex:'Influenza, Ebola, Measles, Rabies',e:'Influenza virus',v:{e:1,t:'R',k:'ss',s:'−',z:'RdRp'},
d:'The genome is complementary (互補) to mRNA and cannot be translated. The virion must therefore bring an RdRp to make +mRNA before any protein can be made.',cf:'Confused with IV: the sense differs, so V must carry RdRp but IV does not.',
m:['R:−ssRNA','E:Virion RdRp','R:+mRNA','P:Proteins'],r:['R:−ssRNA','E:RdRp','R:+ssRNA antigenome','E:RdRp','R:new −ssRNA']},
{n:'VI',t:'RNA-RT',g:'+ssRNA with reverse transcription (diploid 二倍體)',env:'Yes',enz:'Reverse transcriptase (RT), integrase',site:'Cytoplasm → nucleus',mrna:'RNA → cDNA → dsDNA provirus → host RNA pol II → mRNA',rep:'Provirus transcribed into new genomic RNA',ex:'HIV, HTLV',e:'HIV (retrovirus)',v:{e:1,t:'R',k:'dip',z:'RT'},
d:'Retroviruses carry two copies of +ssRNA and reverse transcriptase. RT makes cDNA then dsDNA, which is integrated (整合) into the host chromosome as a provirus (前病毒) and transcribed by host RNA polymerase II.',cf:'Confused with IV: the RNA is +sense but is NOT used as mRNA first; it is copied into DNA.',
m:['R:+ssRNA ×2','E:Reverse transcriptase','D:cDNA → dsDNA','E:Integrase','D:Provirus','E:Host RNA pol II','R:mRNA'],r:['D:Provirus','E:Host RNA pol II','R:Full-length RNA = new genome']},
{n:'VII',t:'DNA-RT',g:'Partially dsDNA (circular) with reverse transcription',env:'Yes',enz:'Reverse transcriptase / polymerase',site:'Nucleus → cytoplasm capsid',mrna:'Gap repaired → cccDNA → host RNA pol II → mRNA + pgRNA',rep:'pgRNA reverse-transcribed in the capsid by viral RT',ex:'Hepatitis B virus (HBV)',e:'HBV',v:{e:1,t:'D',k:'circ',z:'RT'},
d:'The genome is a gapped circular DNA. Host enzymes repair it into covalently closed circular DNA (cccDNA), which is transcribed into mRNA and pregenomic RNA (pgRNA, 前基因組RNA). Viral RT then converts pgRNA back into DNA inside new capsids.',cf:'Confused with VI: VII packages DNA (RT acts late); VI packages RNA (RT acts early).',
m:['D:Gapped circular DNA','E:Host repair enzymes','D:cccDNA','E:Host RNA pol II','R:mRNA + pgRNA','P:Proteins'],r:['R:pgRNA','E:Viral RT (in capsid)','D:−DNA strand','E:Polymerase','D:Partial dsDNA genome']}];
const $=s=>document.querySelector(s),col=t=>t=='D'?'#2563eb':'#dc2626';
const wv=(y,x,c,n=3)=>`<path d="M${x} ${y}${' q8 -12 16 0 t16 0'.repeat(1)+' t16 0'.repeat(n-1)}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`;
function vir(v){let c=col(v.t),s='<svg viewBox="0 0 200 200" width="100%">';
if(v.e){s+='<circle cx="100" cy="100" r="92" fill="#fed7aa" stroke="#ea580c" stroke-width="6"/>';for(let i=0;i<16;i++){let a=i*Math.PI/8;s+=`<circle cx="${100+99*Math.cos(a)}" cy="${100+99*Math.sin(a)}" r="5" fill="#c026d3"/>`}}
s+='<polygon points="100,38 154,69 154,131 100,162 46,131 46,69" fill="#c7d2fe" stroke="#6366f1" stroke-width="5"/>';
if(v.k=='ds')s+=wv(96,68,c)+wv(106,68,c);else if(v.k=='ss')s+=wv(100,68,c);
else if(v.k=='dip')s+=wv(86,68,c)+wv(108,68,c);
else s+=`<circle cx="100" cy="98" r="22" fill="none" stroke="${c}" stroke-width="4"/><circle cx="100" cy="98" r="15" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="60 40"/>`;
if(v.s)s+=`<text x="100" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="${c}">${v.s}</text>`;
if(v.z)s+=`<rect x="70" y="136" width="60" height="18" rx="9" fill="#9333ea"/><text x="100" y="149" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${v.z}</text>`;
return s+'</svg>'}
const LG='<div class="lg"><span><i style="background:#ea580c"></i>Envelope (外套膜)</span><span><i style="background:#c026d3"></i>Spike proteins</span><span><i style="background:#6366f1"></i>Capsid (蛋白質外殼)</span><span><i style="background:#2563eb"></i>DNA</span><span><i style="background:#dc2626"></i>RNA</span><span><i style="background:#9333ea"></i>Virus-carried enzyme (病毒自帶)</span></div>';
const org=(s,n)=>/host\/viral|DNA-dep/.test(s)?'hv':/Host/.test(s)?'h':(n=='IV'||n=='VII')?'ve':'vc';
const OT={h:'host cell (宿主細胞)',hv:'host or virus',ve:'virus-encoded (病毒編碼)',vc:'virus-carried (病毒自帶)'};
const fl=(a,n)=>'<div class="flow">'+a.map((x,i)=>{let[t,s]=x.split(/:(.+)/),o=t=='E'?org(s,n):'';return(i?'<em>→</em>':'')+`<span class="b ${t} ${o}">${s}${o?`<small>${OT[o]}</small>`:''}</span>`}).join('')+'</div>'
const TABS=['Overview','Definitions','Compare','Quiz'];
$('#nav').innerHTML=TABS.map((t,i)=>`<button onclick="go(${i})">${t}</button>`).join('');
function go(i){document.querySelectorAll('.sec').forEach((e,j)=>e.classList.toggle('on',i==j));document.querySelectorAll('nav button').forEach((e,j)=>e.classList.toggle('on',i==j));scrollTo(0,0)}
// Overview
$('#s0').innerHTML=`<div class="card"><h2>Baltimore Classification</h2><p>Viruses are sorted into seven groups by <b>how they make mRNA</b> from their genome (created by David Baltimore, 1971). Ask three questions: DNA or RNA? Single or double strand (股)? Does it use reverse transcription (反轉錄)? Envelope presence does <b>not</b> define a group.</p>${LG}<div class="grid">${C.map(c=>`<div>${vir(c.v)}<b>${c.n}: ${c.t}</b><br>e.g. ${c.e}</div>`).join('')}</div></div>
<div class="card sc"><table><tr><th>Group</th><th>Genome</th><th>Envelope?</th><th>Enzyme in virion</th><th>Examples</th></tr>${C.map(c=>`<tr><td><b>${c.n}</b></td><td>${c.g}</td><td>${c.env}</td><td>${c.enz}</td><td>${c.ex}</td></tr>`).join('')}</table></div>`;
// Definitions
let cur=0;
$('#s1').innerHTML=`<div class="def"><div class="pane"><div id="dc" class="card"></div></div><div class="tabs">${C.map((c,i)=>`<button onclick="show(${i})">${c.n}</button>`).join('')}</div></div>`;
function paint(i){let c=C[i];$('#dc').innerHTML=`<h2>Group ${c.n}: ${c.g}</h2><div class="two"><div>${vir(c.v)}<div class="zh" style="font-size:12px;text-align:center">Model: ${c.e}</div></div><div><p>${c.d}</p><p><b>Replication site:</b> ${c.site}<br><b>Examples:</b> ${c.ex}</p><div class="ex">⚠ ${c.cf}</div></div></div>${LG}<h3>mRNA synthesis (轉錄)</h3>${fl(c.m,c.n)}<h3>Genome replication (複製)</h3>${fl(c.r,c.n)}<div class="lg"><span><i style="background:#2563eb"></i>DNA</span><span><i style="background:#dc2626"></i>RNA</span><span><i style="background:#ca8a04"></i>Enzyme from host cell</span><span><i style="background:#9333ea"></i>Enzyme from virus (carried or encoded)</span><span><i style="background:linear-gradient(90deg,#ca8a04 50%,#9333ea 50%)"></i>Either</span><span><i style="background:#16a34a"></i>Protein</span></div>${fig(c.n)}`;
document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('on',j==i))}
function show(i){if(i==cur)return;let d=$('#dc'),s=i>cur?1:-1;cur=i;d.style.setProperty('--d',s);d.className='card out';setTimeout(()=>{paint(i);d.style.setProperty('--d',s);d.className='card in';void d.offsetWidth;d.className='card'},450)}
// Replication diagrams (Groups VI & VII)
const WV=(x,y,c,n=3)=>`<path d="M${x} ${y} q6 -9 12 0${' t12 0'.repeat(n-1)}" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`;
const AR=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="currentColor" stroke-width="2" marker-end="url(#ar)"/>`;
const TX=(x,y,s,z=10,w='')=>`<text x="${x}" y="${y}" font-size="${z}" ${w} text-anchor="middle" fill="currentColor">${s}</text>`;
const BD=(x,y,s,c)=>{let w=s.length*6.2+16;return`<rect x="${x-w/2}" y="${y-9}" width="${w}" height="18" rx="9" fill="${c}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${s}</text>`};
const HX=(x,y,r)=>`<polygon points="${[0,1,2,3,4,5].map(k=>(x+r*Math.cos(k*Math.PI/3+Math.PI/6))+','+(y+r*Math.sin(k*Math.PI/3+Math.PI/6))).join(' ')}" fill="#c7d2fe" stroke="#6366f1" stroke-width="2.5"/>`;
const RB='#dc2626',BL='#2563eb',HO='#ca8a04',VI='#9333ea';
const SV=b=>`<h3>Replication cycle diagram (複製機制圖)</h3><div class="sc"><svg viewBox="0 0 680 380" width="100%" style="min-width:560px"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs><rect x="4" y="4" width="672" height="372" rx="26" fill="none" stroke="#94a3b8" stroke-width="3"/>${TX(110,28,'Host cell: cytoplasm (細胞質)',12,'font-weight="700"')}<ellipse cx="480" cy="200" rx="185" ry="150" fill="rgba(99,102,241,.1)" stroke="#6366f1" stroke-width="3"/>${TX(480,66,'Nucleus (細胞核)',12,'font-weight="700"')}${b}</svg></div>`;
const f6=()=>SV(`<circle cx="70" cy="85" r="34" fill="#fed7aa" stroke="#ea580c" stroke-width="4"/>${HX(70,85,20)}${WV(58,82,RB)}${WV(58,92,RB)}${TX(70,135,'① HIV virion: 2× +ssRNA')}${BD(70,150,'RT in virion',VI)}${AR(70,162,70,186)}${TX(118,176,'uncoating')}${WV(30,205,RB,4)}${AR(84,205,110,205)}${WV(114,201,RB,4)}${WV(114,209,BL,4)}${AR(168,205,194,205)}${WV(198,201,BL,4)}${WV(198,209,BL,4)}${AR(252,205,340,205)}${BD(139,180,'RT',VI)}${BD(296,184,'Integrase',VI)}${TX(54,232,'② +ssRNA')}${TX(138,232,'③ RNA:DNA hybrid')}${TX(224,232,'④ dsDNA (cDNA)')}<path d="M345 240 q20 -14 40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#f59e0b" stroke-width="6"/><path d="M425 240 q20 -14 40 0 t40 0" fill="none" stroke="${BL}" stroke-width="6"/>${AR(340,208,420,232)}${TX(465,264,'⑤ Provirus (integrated DNA)')}${BD(465,150,'Host RNA pol II',HO)}${AR(465,162,465,222)}${TX(540,186,'⑥ transcription')}${AR(505,240,540,282)}${WV(545,292,RB,4)}${TX(585,314,'⑦ mRNA + genomic RNA')}${AR(535,296,290,320)}<circle cx="262" cy="322" r="9" fill="#64748b"/><circle cx="262" cy="310" r="6" fill="#94a3b8"/>${TX(262,347,'⑧ Ribosome: translation')}${AR(250,322,190,322)}<ellipse cx="162" cy="322" rx="26" ry="13" fill="#16a34a"/>${TX(150,347,'viral proteins')}${AR(134,322,102,322)}<circle cx="70" cy="322" r="28" fill="#fed7aa" stroke="#ea580c" stroke-width="4"/>${HX(70,322,16)}${TX(70,364,'⑨ Assembly & budding')}`);
const f7=()=>SV(`<circle cx="70" cy="85" r="34" fill="#fed7aa" stroke="#ea580c" stroke-width="4"/>${HX(70,85,20)}<circle cx="70" cy="85" r="9" fill="none" stroke="${BL}" stroke-width="3" stroke-dasharray="40 16"/>${TX(70,135,'① HBV virion: gapped DNA')}${BD(70,150,'Pol/RT in virion',VI)}${AR(110,92,322,128)}${TX(215,96,'nuclear import')}<circle cx="350" cy="135" r="18" fill="none" stroke="${BL}" stroke-width="4"/><circle cx="350" cy="135" r="11" fill="none" stroke="${BL}" stroke-width="3" stroke-dasharray="45 25"/>${TX(350,170,'② rcDNA (gap)')}${AR(350,176,350,198)}${BD(285,187,'Host repair',HO)}<circle cx="350" cy="222" r="18" fill="none" stroke="${BL}" stroke-width="5"/>${TX(350,256,'③ cccDNA')}${AR(372,222,440,222)}${BD(445,197,'Host RNA pol II',HO)}${WV(446,224,RB,5)}${TX(490,250,'④ pgRNA + mRNAs')}${AR(470,258,330,305)}${HX(300,322,22)}${WV(288,322,RB,2)}${TX(300,362,'⑤ Packaging')}${AR(326,322,236,322)}${BD(281,302,'Viral RT',VI)}${HX(210,322,22)}${WV(198,318,BL,2)}${WV(198,326,BL,1)}${TX(210,362,'⑥ RT: pgRNA → DNA')}${AR(184,322,114,322)}<circle cx="80" cy="322" r="30" fill="#fed7aa" stroke="#ea580c" stroke-width="4"/>${HX(80,322,18)}${WV(70,322,BL,2)}${TX(80,366,'⑦ Envelope → secretion')}<path d="M200 296 Q130 200 322 130" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>${TX(125,215,'recycling (循環回核)')}`);
const fig=n=>n=='VI'?f6():n=='VII'?f7():'';
// Compare
const RW=[['Genome','g'],['Envelope?','env'],['Enzyme carried in virion','enz'],['Replication site','site'],['mRNA synthesis','mrna'],['Genome replication','rep'],['Examples','ex'],['Easily confused with…','cf']];
$('#s2').innerHTML=`<div class="card"><h2>Compare two groups</h2><select id="ca">${C.map((c,i)=>`<option value="${i}">Group ${c.n}: ${c.t}</option>`).join('')}</select> vs <select id="cb">${C.map((c,i)=>`<option value="${i}" ${i==3?'selected':''}>Group ${c.n}: ${c.t}</option>`).join('')}</select><p class="zh">Highlighted rows = differences (黃底為相異處).</p><div class="sc" id="ct"></div></div>`;
function cmp(){let a=C[$('#ca').value],b=C[$('#cb').value];$('#ct').innerHTML=`<table><tr><th></th><th>Group ${a.n} (${a.t})</th><th>Group ${b.n} (${b.t})</th></tr><tr><td>Model virus</td><td>${vir(a.v).replace('width="100%"','width="110"')}</td><td>${vir(b.v).replace('width="100%"','width="110"')}</td></tr>${RW.map(([l,k])=>`<tr class="${a[k]!=b[k]?'dif':''}"><td><b>${l}</b></td><td>${a[k]}</td><td>${b[k]}</td></tr>`).join('')}</table>`}
$('#ca').onchange=$('#cb').onchange=cmp;cmp();
// Quiz: first option is the correct one (shuffled at render)
